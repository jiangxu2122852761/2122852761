<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif;}
body{
    background:#eef1f8;
    min-height:100vh;
    padding:60px 20px;
    background-image: radial-gradient(circle at 20% 10%, #c7d2ff 0%, transparent 45%),
    radial-gradient(circle at 80% 85%, #b8c8ff 0%, transparent 45%);
}
.container{
    max-width:900px;
    margin:0 auto;
}
h1{
    text-align:center;
    font-size:48px;
    color:#222;
    margin-bottom:32px;
}
.notice-box{
    background:rgba(255,255,255,0.65);
    backdrop-filter: blur(12px);
    border-left:5px solid #407bff;
    padding:20px 24px;
    border-radius:12px;
    box-shadow:0 2px 12px rgba(0,0,0,0.08);
    margin-bottom:36px;
}
.notice-text{
    font-size:15px;
    line-height:1.6;
    color:#333;
}
.btn-wrap{
    display:block;
    width:100%;
    border-radius:16px;
    margin-bottom:18px;
    transition: all 0.22s ease;
}
.btn-wrap:hover{
    transform: translateY(-3px);
}
.btn-wrap:active{
    transform: translateY(2px);
}
.btn-item{
    display:block;
    width:100%;
    border:none;
    border-radius:16px;
    color:#ffffff;
    font-size:18px;
    padding:22px;
    text-align:center;
    text-decoration:none;
    background: rgba(255, 255, 255, 0.18);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border:1px solid rgba(255,255,255,0.35);
    box-shadow: 0 8px 24px rgba(30, 40, 90, 0.15),
    inset 0 1px 0 rgba(255,255,255,0.45);
    cursor:pointer;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.22s ease,box-shadow 0.22s ease;
}
.btn-wrap:hover .btn-item{
    background: rgba(255, 255, 255, 0.32);
    box-shadow: 0 12px 30px rgba(30, 40, 90, 0.2),
    inset 0 1px 0 rgba(255,255,255,0.45);
}
.btn-wrap:active .btn-item{
    background: rgba(255, 255, 255, 0.24);
    box-shadow: 0 3px 10px rgba(30, 40, 90, 0.10),
    inset 0 1px 0 rgba(255,255,255,0.45);
}
.row-two{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}
</style>
</head>

</div>
<script>
// 生成短促按压咔哒反馈音，无需音频文件
let audioCtx = null;
document.querySelectorAll('.btn-item').forEach(btn=>{
    btn.addEventListener('mousedown', function(e){
        if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'square';
        osc.frequency.value = 1200;
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
        osc.start(audioCtx.currentTime);
        osc.stop(audioCtx.currentTime + 0.04);
    })
})
</script>
